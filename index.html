<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise 💖</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    text-align: center;
    color: white;
}

.container {
    position: relative;
}

h1 {
    font-size: 40px;
    text-shadow: 2px 2px 10px red;
}

button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 20px;
    transition: all 0.2s ease;
}

#yesBtn {
    background-color: #ff1e56;
    color: white;
}

#noBtn {
    background-color: white;
    color: #ff1e56;
    position: absolute;
    left: 60%;
    top: 60%;
}
</style>
</head>

<body>

<div class="container">
    <h1 id="question"></h1>
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 😢</button>
</div>

<audio id="bgMusic">
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
</audio>

<script>
/* ========= NAME PERSONALIZATION ========= */
const name = new URLSearchParams(window.location.search).get("name") || "Kirti";
document.getElementById("question").innerText =
    "Will you be my Valentine, " + name + "? 💕";

/* ========= IMPOSSIBLE NO BUTTON ========= */
const noBtn = document.getElementById("noBtn");

function moveNoButton() {
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

// Move when hovered
noBtn.addEventListener("mouseover", moveNoButton);

// Move when cursor gets close (extra evil 😈)
document.addEventListener("mousemove", (e) => {
    const rect = noBtn.getBoundingClientRect();
    const distance = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    if (distance < 100) {
        moveNoButton();
    }
});

// Prevent clicking
noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    moveNoButton();
});

/* ========= YES BUTTON CELEBRATION ========= */
const yesBtn = document.getElementById("yesBtn");

yesBtn.addEventListener("click", () => {

    const music = document.getElementById("bgMusic");
    music.play();

    // Ensure music plays at least 10 seconds
    setTimeout(() => {
        music.pause();
    }, 10000);

    // Confetti 🎉
    confetti({
        particleCount: 300,
        spread: 150,
        origin: { y: 0.6 }
    });

    // Fireworks 🎆
    for (let i = 0; i < 25; i++) {
        setTimeout(() => {
            confetti({
                particleCount: 50,
                spread: 360,
                startVelocity: 30,
                origin: {
                    x: Math.random(),
                    y: Math.random() - 0.2
                }
            });
        }, i * 200);
    }

    // Show celebration page after 2 sec
    setTimeout(() => {
        document.body.innerHTML = `
            <div style="
                height:100vh;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
                background:linear-gradient(135deg,#ff0844,#ffb199);
                color:white;
                text-align:center;
            ">
                <h1 style="font-size:55px;">YAYYYYY 💖💖💖</h1>
                <p style="font-size:30px;">
                    ${name}, you just made me the happiest person alive 🥰
                </p>
                <div style="font-size:60px;">❤️ 💕 💘 💝 💖</div>
            </div>
        `;
    }, 2000);
});
</script>

</body>
</html>
